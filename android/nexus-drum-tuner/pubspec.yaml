name: nexus_drum_tuner
description: Nexus Drum Tuner - Afinador de Bateria Profissional (Nexus Works Digital).
publish_to: 'none'
version: 1.2.0+6

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  record: ^6.1.1
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.2
  http: ^1.2.2
  package_info_plus: ^8.1.0
  ota_update: ^7.1.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/img/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon_square.png
  remove_alpha_ios: true
  adaptive_icon_background: "#08080A"
  adaptive_icon_foreground: assets/icon/foreground.png
