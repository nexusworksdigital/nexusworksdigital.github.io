name: Nexus Drum Tuner – Android (APK)

# Roda sozinho quando o app (android/nexus-drum-tuner) muda,
# ou manualmente em Actions › "Nexus Drum Tuner – Android" › Run workflow.
# Gera os APKs, assina com a chave da Nexus (segredos NT_KEYSTORE_*),
# publica na release "nexus-drum-tuner" e atualiza o feed do app
# (nexus-drum-tuner/feed.json), que dispara o aviso no sino de notificações.
on:
  push:
    branches: [main]
    paths:
      - 'android/nexus-drum-tuner/**'
      - '.github/workflows/nexus-drum-tuner-android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nexus-drum-tuner-android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android/nexus-drum-tuner
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Preparar projeto Android
        run: |
          flutter create --org com.nexusworksdigital --project-name nexus_drum_tuner --platforms android .
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.RECORD_AUDIO"/>\n    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"/>\n    <application#' $M
          sed -i 's/android:label="nexus_drum_tuner"/android:label="Nexus Drum Tuner"/' $M
          sed -i 's#</application>#    <provider android:name="sk.fourq.otaupdate.OtaUpdateFileProvider" android:authorities="${applicationId}.ota_update_provider" android:exported="false" android:grantUriPermissions="true"><meta-data android:name="android.support.FILE_PROVIDER_PATHS" android:resource="@xml/filepaths"/></provider>\n    </application>#' $M
          sed -i 's#</manifest>#    <queries><intent><action android:name="android.intent.action.VIEW"/><data android:scheme="https"/></intent></queries>\n</manifest>#' $M
          mkdir -p android/app/src/main/res/xml
          printf '<?xml version="1.0" encoding="utf-8"?>\n<paths xmlns:android="http://schemas.android.com/apk/res/android">\n    <files-path name="internal_apk_storage" path="ota_update/"/>\n</paths>\n' > android/app/src/main/res/xml/filepaths.xml
          for G in android/app/build.gradle.kts android/app/build.gradle; do
            [ -f $G ] && sed -i -E 's/minSdk\s*=\s*flutter\.minSdkVersion/minSdk = 23/; s/minSdkVersion\s+flutter\.minSdkVersion/minSdkVersion 23/' $G
          done
          # ota_update exige "core library desugaring"
          python3 - <<'PY'
          import re, pathlib
          k = pathlib.Path('android/app/build.gradle.kts')
          if k.exists():
              t = k.read_text()
              t = t.replace('compileOptions {', 'compileOptions {\n        isCoreLibraryDesugaringEnabled = true', 1)
              t += '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
              k.write_text(t)
          else:
              g = pathlib.Path('android/app/build.gradle')
              t = g.read_text()
              t = t.replace('compileOptions {', 'compileOptions {\n        coreLibraryDesugaringEnabled true', 1)
              t += "\ndependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'\n}\n"
              g.write_text(t)
          PY
          cat android/app/build.gradle* | head -60
          cat $M
          flutter pub get
          dart run flutter_launcher_icons

      - name: Análise e testes
        continue-on-error: true
        run: |
          flutter analyze --no-fatal-infos || true
          flutter test

      - name: Compilar
        run: flutter build apk --release --split-per-abi

      - name: Assinar com a chave da Nexus
        env:
          NT_KEYSTORE_B64: ${{ secrets.NT_KEYSTORE_B64 }}
          NT_KEYSTORE_PASSWORD: ${{ secrets.NT_KEYSTORE_PASSWORD }}
          NT_KEY_ALIAS: ${{ secrets.NT_KEY_ALIAS }}
          NT_KEY_PASSWORD: ${{ secrets.NT_KEY_PASSWORD }}
        run: |
          if [ -z "$NT_KEYSTORE_B64" ]; then echo "::error::Segredo NT_KEYSTORE_B64 ausente"; exit 1; fi
          echo "$NT_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/nexus.jks"
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          ALIAS="${NT_KEY_ALIAS:-nexustuner}"
          KP="${NT_KEY_PASSWORD:-$NT_KEYSTORE_PASSWORD}"
          mkdir -p dist
          OUT=build/app/outputs/flutter-apk
          for pair in "arm64-v8a:arm64" "armeabi-v7a:armv7"; do
            ABI=${pair%%:*}; NAME=${pair##*:}
            "$BT/zipalign" -f -p 4 $OUT/app-$ABI-release.apk dist/tmp-$NAME.apk
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/nexus.jks" --ks-key-alias "$ALIAS" \
              --ks-pass env:NT_KEYSTORE_PASSWORD --key-pass pass:"$KP" \
              --out dist/NexusDrumTuner-$NAME.apk dist/tmp-$NAME.apk
            rm dist/tmp-$NAME.apk
            "$BT/apksigner" verify dist/NexusDrumTuner-$NAME.apk
          done
          ls -la dist

      - uses: actions/upload-artifact@v5
        with:
          name: NexusDrumTuner-${{ github.run_number }}
          path: android/nexus-drum-tuner/dist/

      - name: Publicar (release "nexus-drum-tuner")
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          NOTES="Nexus Drum Tuner $V — afinador de bateria profissional. Instale o NexusDrumTuner-arm64.apk (celulares atuais) ou o -armv7 (aparelhos antigos)."
          if gh release view nexus-drum-tuner >/dev/null 2>&1; then
            gh release upload nexus-drum-tuner dist/*.apk --clobber
            gh release edit nexus-drum-tuner --title "Nexus Drum Tuner $V" --notes "$NOTES"
          else
            gh release create nexus-drum-tuner dist/*.apk --title "Nexus Drum Tuner $V" --notes "$NOTES"
          fi

      - name: Atualizar o feed do app (aviso no sino)
        run: |
          python3 - <<'EOF'
          import json, hashlib, re, datetime, pathlib
          ver = re.search(r'^version:\s*([\d.]+)\+(\d+)', open('pubspec.yaml').read(), re.M)
          name, code = ver.group(1), int(ver.group(2))
          sha = lambda f: hashlib.sha256(open(f, 'rb').read()).hexdigest()
          base = 'https://github.com/nexusworksdigital/nexusworksdigital.github.io/releases/download/nexus-drum-tuner/'
          notes = [l.strip() for l in open('novidades.txt', encoding='utf-8') if l.strip()]
          p = pathlib.Path('../../nexus-drum-tuner/feed.json')
          feed = json.loads(p.read_text(encoding='utf-8')) if p.exists() else {'news': []}
          feed['latest'] = {
            'versionCode': code, 'versionName': name,
            'date': datetime.date.today().isoformat(), 'notes': notes,
            'apk_arm64': base + 'NexusDrumTuner-arm64.apk',
            'apk_armv7': base + 'NexusDrumTuner-armv7.apk',
            'sha256_arm64': sha('dist/NexusDrumTuner-arm64.apk'),
            'sha256_armv7': sha('dist/NexusDrumTuner-armv7.apk'),
          }
          p.write_text(json.dumps(feed, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(feed['latest'], indent=2))
          EOF
          cd ../..
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add nexus-drum-tuner/feed.json
          git commit -m "Nexus Drum Tuner: feed atualizado (nova versão)" || exit 0
          for i in 1 2 3; do git pull --rebase -q origin main && git push && break; sleep 5; done
